name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  dotnet-build:
    name: .NET 10 build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

  termux-build:
    name: Termux container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull Termux container
        run: docker pull termux/termux-docker:x86_64

      - name: Test .NET 10 inside Termux
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            termux/termux-docker:x86_64 \
            bash -lc '
              set -euxo pipefail

              pkg update -y
              pkg install -y dotnet-sdk-10.0 git

              echo "== Termux environment =="
              uname -a
              echo "PREFIX=$PREFIX"
              echo "HOME=$HOME"

              echo "== .NET =="
              dotnet --info

              echo "== Restore =="
              dotnet restore

              echo "== Build =="
              dotnet build --configuration Release --no-restore

              echo "== Publish =="
              dotnet publish --configuration Release --no-build --output /tmp/termux-host-publish

              test -f /tmp/termux-host-publish/TermuxHost.dll || \
                test -f /tmp/termux-host-publish/TermuxHost.Web.dll
            '

      - name: Validate installer shell syntax
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            termux/termux-docker:x86_64 \
            bash -n install.sh
