name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  dotnet-build:
    name: .NET 10 build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

  termux-build:
    name: Termux install and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull Termux container
        run: docker pull termux/termux-docker:x86_64

      - name: Run installer and curl hosting UI
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            termux/termux-docker:x86_64 \
            bash -lc '
              set -euxo pipefail

              echo "== Validate installer syntax =="
              bash -n /workspace/install.sh

              echo "== Run real installer against checked-out source =="
              TERMUX_HOST_SOURCE_DIR=/workspace \
              TERMUX_HOST_PORT=5050 \
              bash /workspace/install.sh

              echo "== Verify generated service =="
              test -x "$PREFIX/var/service/termux-host/run"
              test -f "$HOME/termux-host/publish/TermuxHost.dll"

              echo "== Start generated hosting service script =="
              "$PREFIX/var/service/termux-host/run" > "$HOME/termux-host-ci.log" 2>&1 &
              APP_PID=$!
              trap "kill $APP_PID 2>/dev/null || true" EXIT

              echo "== Wait for HTTP endpoint =="
              for attempt in $(seq 1 30); do
                if curl --fail --silent --show-error http://127.0.0.1:5050/ > "$HOME/termux-host-response.html"; then
                  break
                fi

                if ! kill -0 "$APP_PID" 2>/dev/null; then
                  echo "TermuxHost exited before becoming ready"
                  cat "$HOME/termux-host-ci.log"
                  exit 1
                fi

                sleep 1
              done

              echo "== Assert HTTP response =="
              curl --fail --silent --show-error http://127.0.0.1:5050/ | tee "$HOME/termux-host-response.html"
              test -s "$HOME/termux-host-response.html"

              echo "== Process still running =="
              kill -0 "$APP_PID"

              echo "== TermuxHost logs =="
              cat "$HOME/termux-host-ci.log"
            '
