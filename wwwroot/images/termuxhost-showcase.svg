<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">TermuxHost showcase</title>
  <desc id="desc">Promotional thumbnail showing a mobile and web hosting dashboard for ASP.NET Core apps on Termux.</desc>
  <defs>
