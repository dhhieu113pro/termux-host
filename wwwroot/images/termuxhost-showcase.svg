    <g><rect width="520" height="92" rx="20" fill="#0b1220" stroke="#1e293b"/><rect x="18" y="18" width="56" height="56" rx="14" fill="#062b1b" stroke="#22c55e"/><text x="98" y="38" fill="#f8fafc" font-size="25" font-weight="700">Manage Your Apps</text><text x="98" y="67" fill="#94a3b8" font-size="18">Start, stop, restart and monitor hosted apps.</text></g>
